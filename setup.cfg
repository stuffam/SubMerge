# Lint configuration.  This is not a Python package; setup.cfg is here only
# because it is where pycodestyle looks, so that a bare `pycodestyle` run
# locally checks exactly what CI checks.

[pycodestyle]
max-line-length = 100

# SubMerge-Test-Data holds comparison fixtures, not source.  Their formatting
# - blank lines, trailing newlines, indentation - is the input under test, so
# a linter must never be the reason one of them changes.
exclude = .git,__pycache__,dist,SubMerge-Test-Data
